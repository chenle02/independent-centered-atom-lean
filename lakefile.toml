name = "independent-centered-atom-lean"
version = "0.1.0"
defaultTargets = ["ProbabilityCore"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "ProbabilityCore"
roots = ["ProbabilityCore.IndependentCenteredAtom", "ProbabilityCore.Axioms"]
moreLeanArgs = ["-j3", "-DElab.async=false"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "ProbabilityCoreChallenge"
roots = ["ProbabilityCore.Challenge"]
moreLeanArgs = ["-j3", "-DElab.async=false"]
leanOptions = { autoImplicit = false }
